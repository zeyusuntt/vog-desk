# Local data layer for vog-desk. Zetaris reads from these two services.
# MinIO holds derived Parquet (S3 API). Postgres holds institutional tables (JDBC).
#
# The default credentials below are for local development only.
# The services are bound to 127.0.0.1 on the host. Real values, if ever needed,
# come from .env in the repo root. Never commit them.
#
# Both services also join the external network "zetaris_default" so the Zetaris
# containers can reach them by service name (minio, postgres).

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vogdesk}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vogdesk-local-only}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - default
      - zetaris

  # Creates the bucket once, then exits.
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vogdesk}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vogdesk-local-only}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        && mc mb --ignore-existing local/vogdesk
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vogdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vogdesk-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-vogdesk}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - default
      - zetaris

volumes:
  minio-data:
  pg-data:

networks:
  zetaris:
    external: true
    name: zetaris_default
