# Local data layer for vog-desk. Zetaris reads from these two services.
# s3 holds derived Parquet behind an S3 API. Postgres holds institutional tables (JDBC).
#
# The S3 server is RustFS, an S3-compatible store with the same API shape as MinIO. MinIO's own
# images were no longer pullable on 23 Oct 2026 (Docker Hub repository removed, quay.io tags
# unauthorised), so the service keeps the MinIO-style credential variables and swaps the image.
#
# The default credentials below are for local development only.
# The services are bound to 127.0.0.1 on the host. Real values, if ever needed,
# come from .env in the repo root. Never commit them.
#
# Both services also join the external network "zetaris_default" so the Zetaris
# containers can reach them by service name (s3, vogpg). The Postgres service is deliberately not
# called postgres: Zetaris has its own container with that name on the shared network, and a
# second one would shadow it (seen on 23 Oct 2026: Zetaris tried to log in to ours).

services:
  s3:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:-vogdesk}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-vogdesk-local-only}
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - s3-data:/data
      - s3-logs:/logs
    networks:
      - default
      - zetaris

  vogpg:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vogdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vogdesk-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-vogdesk}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - default
      - zetaris

volumes:
  s3-data:
  s3-logs:
  pg-data:

networks:
  zetaris:
    external: true
    name: zetaris_default
